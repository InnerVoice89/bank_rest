services:
  app:
    build: .
    container_name: app_bank
    depends_on:
      - db
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - app-logs:/var/log/myapp

  db:
    image: postgres:17-alpine
    container_name: pg_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: bank_rest
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: pass
    volumes:
      - ./base_data:/var/lib/postgresql/data

volumes:
  app-logs:
